    <!--
      `interactive-widget=resizes-content`: when the software keyboard opens, the
      layout viewport shrinks with it, so the bottom-anchored sheets (Ask, the
      palette) rise above the keys instead of hiding behind them. One token, read
      by Chrome and Android, ignored where it is unsupported. No listener: a
      `visualViewport` resize handler fires continuously while the keyboard
      animates, which is per-frame work the estate does not take on.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!--
      One theme colour, deliberately, and not a pair scoped to light and dark.
      The estate has no light mode — `color-scheme` below says so and no
      stylesheet in the tree asks `prefers-color-scheme` — so it is navy at every
      hour and on every device. A light-scoped tag would paint pale chrome over a
      navy page, which is the mismatch the split is meant to cure, not cause.
    -->
    <meta name="theme-color" content="#0d1a2e" />
    <meta name="color-scheme" content="dark" />
    <!--
      iOS reads none of the manifest: added to the home screen it takes its name,
      its chrome and its full-screen behaviour from these three. `black-translucent`
      puts the painting under the status bar, which is what `viewport-fit=cover`
      above is already asking for. The unprefixed spelling is the standard one
      every other engine reads; Safari still wants the `apple-` name.
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!--
      The Twitter half, written out rather than left to fall back.

      `summary_large_image` promises a picture, and a card that names no image
      of its own is rendered blank by more than one reader rather than quietly
      borrowing the Open Graph one. The three `twitter:` lines below are the
      same estate, the same sentence and the same painting as above; they exist
      because a reader that only speaks Twitter's dialect has nothing to read
      otherwise. The absolute URLs are deliberate: a share card is fetched by a
      machine that has no page to resolve a relative path against.
    -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kamisato Ayaka · Estate" />
    <meta
      name="twitter:description"
      content="A quiet estate of rooms: the tea room, the koi courtyard, the heron's Bible, live clocks and host telemetry."
    />
    <meta name="twitter:image" content="https://noctis2114.github.io/kamisato-estate-visit/estate/courtyard-afternoon-1280w.jpg" />
    <meta name="twitter:image:alt" content="The koi courtyard of the Kamisato estate in the afternoon." />
    <!--
      One address for the whole estate.

      Every room is a query string on the same document — `?tea=1`, `?card=…`,
      `?view=lab` — so a crawler that follows the estate's own links finds a
      hundred URLs serving one page and files them as duplicates of each other.
      The canonical link says which one of them is the page.
    -->
    <link rel="canonical" href="https://noctis2114.github.io/kamisato-estate-visit/" />
    <!--
      The two faces every first paint sets in: the Latin serif of the door and
      the deck's sans. Preloaded rather than inlined as `@font-face` rules: the
      built page carries `script-src 'self'; style-src 'self'`, so an inline
      `<style>` would be refused by the browser, and these two links already put
      both woff2 in flight at parse time, which is what inlining was for.

      The front door's painting is not preloaded for the same reason. Which
      painting it is depends on the visitor's own clock — the gate at morning,
      afternoon, evening or night — and only a script can read that; a fixed
      choice would fetch the wrong scene three times in four and put a quarter of
      a megabyte of waste on the critical path. It is fetched by `Painting` as
      soon as the bundle runs, over its blurred placeholder.
    -->
    <link rel="preload" href="./fonts/noto-serif-jp-latin-400.woff2" as="font" type="font/woff2" crossorigin />
